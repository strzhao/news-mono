<h2>首页播客卡片设计</h2>
<p class="subtitle">播客卡片在日报上方展示，用户一键收听今日播客</p>

<div class="cards">
  <div class="card" data-choice="compact" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;border-radius:12px;padding:20px;color:#e0e0e0;font-family:system-ui">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px">🎙</div>
          <div>
            <div style="font-size:15px;font-weight:600">AI 主编圆桌</div>
            <div style="font-size:12px;color:#9ca3af">雷鸣 × 苏诺 × 林默 · 18 min</div>
          </div>
          <div style="margin-left:auto">
            <div style="width:40px;height:40px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer">▶</div>
          </div>
        </div>
        <div style="font-size:13px;color:#d1d5db;line-height:1.5">DeepSeek V4 开源冲击波 · Agent SDK 新范式 · AI 编程安全隐患</div>
        <div style="margin-top:10px;height:3px;background:#333;border-radius:2px">
          <div style="width:0%;height:100%;background:#6366f1;border-radius:2px"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 紧凑型卡片</h3>
      <p>一行显示参与主编和时长，话题作为标签展示，占用空间小，适合首页顶部</p>
    </div>
  </div>

  <div class="card" data-choice="expanded" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;border-radius:12px;padding:20px;color:#e0e0e0;font-family:system-ui">
        <div style="font-size:12px;color:#6366f1;font-weight:600;margin-bottom:8px">🎙 今日播客</div>
        <div style="font-size:17px;font-weight:700;margin-bottom:6px">DeepSeek V4 开源：真香还是真坑？</div>
        <div style="font-size:12px;color:#9ca3af;margin-bottom:14px">2026/04/11 · 18 min</div>

        <div style="display:flex;gap:8px;margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:6px;background:#2a2a3e;padding:4px 10px;border-radius:16px;font-size:12px">
            <div style="width:24px;height:24px;border-radius:50%;background:#ef4444;display:flex;align-items:center;justify-content:center;font-size:10px">雷</div>
            <span>雷鸣</span>
            <span style="color:#9ca3af;font-size:10px">主持</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;background:#2a2a3e;padding:4px 10px;border-radius:16px;font-size:12px">
            <div style="width:24px;height:24px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:10px">苏</div>
            <span>苏诺</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;background:#2a2a3e;padding:4px 10px;border-radius:16px;font-size:12px">
            <div style="width:24px;height:24px;border-radius:50%;background:#10b981;display:flex;align-items:center;justify-content:center;font-size:10px">林</div>
            <span>林默</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0">▶</div>
          <div style="flex:1">
            <div style="height:3px;background:#333;border-radius:2px">
              <div style="width:0%;height:100%;background:#6366f1;border-radius:2px"></div>
            </div>
          </div>
          <div style="font-size:11px;color:#9ca3af;flex-shrink:0">0:00 / 18:32</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 展开型卡片</h3>
      <p>用日报标题作为播客标题，主编头像独立展示，更有节目感，占用空间较大</p>
    </div>
  </div>
</div>
